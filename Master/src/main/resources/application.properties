spring.application.name=Master
server.error.whitelabel.enabled=false
server.port=8082
server.servlet.context-path=/harmoni
server.forward-headers-strategy=FRAMEWORK
spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

# 1. Map the URL prefix used in your JSP (/assets/...) to the folder
spring.mvc.static-path-pattern=/assets/**

# 2. Tell Spring where that folder actually lives in your project
spring.web.resources.static-locations=classpath:/static/assets/

# 2. PostgreSQL Configuration (Home PC Setup for Tomorrow)
# Use 'localhost' if running on the same PC, or the IP if running remotely
spring.datasource.url=jdbc:postgresql://localhost:5432/HarmoniEventManagement
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Eureka Client Settings
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT Secret Key - MUST MATCH THE SECRET IN THE AUTH SERVICE
jwt.secret=your-very-long-and-super-secret-key-that-is-at-least-256-bits-long-for-hs256

# 5. Redis Configuration (Optional - Placeholder)
# spring.redis.host=localhost
# spring.redis.port=6379

# 6. Swagger & Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.doc-expansion=none

# 7. File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Event image upload directory — absolute path so it works regardless of Tomcat work dir
upload.dir=C:/Hetvee/Projects/Harmoni/uploads

