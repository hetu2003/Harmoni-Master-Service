spring.application.name=Master
server.error.whitelabel.enabled=false
server.port=8082
server.servlet.context-path=/harmoni
server.forward-headers-strategy=FRAMEWORK
spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

# 1. Map the URL prefix used in your JSP (/assets/...) to the folder
spring.mvc.static-path-pattern=/assets/**

# 2. Tell Spring where that folder actually lives in your project
spring.web.resources.static-locations=classpath:/static/assets/

# 2. PostgreSQL Configuration (Home PC Setup for Tomorrow)
# Use 'localhost' if running on the same PC, or the IP if running remotely
spring.datasource.url=jdbc:postgresql://localhost:5432/HarmoniEventManagement
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Eureka Client Settings
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1

# JWT Secret Key - MUST MATCH THE SECRET IN THE AUTH SERVICE
jwt.secret=your-very-long-and-super-secret-key-that-is-at-least-256-bits-long-for-hs256

# 5. Redis Configuration (Optional - Placeholder)
# spring.redis.host=localhost
# spring.redis.port=6379

# 6. Swagger & Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.doc-expansion=none

# 7. File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 8. Session timeout — keep users logged in for 8 hours of inactivity
server.servlet.session.timeout=8h

# Event image upload directory — absolute path so it works regardless of Tomcat work dir
upload.dir=C:/Hetvee/Projects/Harmoni/uploads

# Razorpay ? from original settings.py
razorpay.key.id=rzp_test_T1tyySYkBdsWmp
razorpay.key.secret=UVrQDWbFQ4YAG9CqMIRWFZGS

# ─── Logging ────────────────────────────────────────────────────────────────
# Write logs to a file so you can read them after a logout happens
logging.file.name=C:/Hetvee/Projects/Harmoni/logs/master.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
# Auth/session debug lines from GatewayHeadersFilter
logging.level.com.Harmoni.Master.config.GatewayHeadersFilter=DEBUG
# General app logs at INFO
logging.level.com.Harmoni.Master=INFO
# Spring Security decisions (shows why a request was denied)
logging.level.org.springframework.security=WARN