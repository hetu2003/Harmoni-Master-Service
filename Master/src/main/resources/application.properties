spring.application.name=Master
server.port=8082
server.servlet.context-path=/api

# 2. PostgreSQL Configuration (Home PC Setup for Tomorrow)
# Use 'localhost' if running on the same PC, or the IP if running remotely
spring.datasource.url=jdbc:postgresql://localhost:5432/harmoni_master_db
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Eureka Client Settings
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# 5. Redis Configuration (Optional - Placeholder)
# spring.redis.host=localhost
# spring.redis.port=6379

# 6. Swagger & Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.doc-expansion=none

# 7. File Upload Limits (Keeping this from your reference)
# Useful if you plan to upload event images or documents
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
